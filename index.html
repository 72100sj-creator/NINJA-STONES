<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ninja Stones">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon-180.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png?v=2">
    <title>Ninja Stones</title>
    
    <!-- FILET DE SÉCURITÉ : Force l'affichage des écrans même si le fichier CSS ne charge pas -->
    <style>
        .screen { 
            opacity: 0; pointer-events: none; position: absolute; top:0; left:0; 
            width:100%; height:100%; display:flex; flex-direction:column; 
            align-items:center; justify-content:center; gap: 15px; 
        }
        .screen.active { opacity: 1; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== RFC-001 : Scene Engine =====
         Toute la scène (photo + décorations + personnage + puzzle) vit dans .game-scene,
         qui garde toujours exactement les proportions de la photo (9:16), quel que soit l'écran.
         .scene-wrapper centre cette scène et comble l'espace restant (s'il y en a) avec une couleur unie,
         plutôt que de rogner la photo différemment selon les appareils. -->
    <div class="scene-wrapper">
        <div class="game-scene" id="game-scene">

            <!-- Background Layer -->
            <div class="scene-background" id="garden-backdrop"></div>

            <!-- Decoration Layer : éléments fixes du décor (bambous, lanterne) -->
            <div class="scene-decor" aria-hidden="true">
                <div class="bamboo-stalk b1"><span class="bamboo-leaf"></span></div>
                <div class="bamboo-stalk b2"><span class="bamboo-leaf"></span></div>
                <div class="bamboo-stalk b3"><span class="bamboo-leaf"></span></div>
                <div class="lantern-ground-glow"></div>
                <div class="lantern-glow"></div>
            </div>

            <!-- Ambient Animation Layer : effets périodiques (feuille, onde du bassin, lucioles) -->
            <div class="scene-ambient" aria-hidden="true">
                <div class="falling-leaf"></div>
                <div class="pond-ripples">
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="pond-sparkle s1"></span>
                    <span class="pond-sparkle s2"></span>
                    <span class="pond-sparkle s3"></span>
                </div>
                <span class="firefly f1"></span>
                <span class="firefly f2"></span>
                <span class="firefly f3"></span>
                <span class="firefly f4"></span>
                <span class="firefly firefly-night f5"></span>
                <span class="firefly firefly-night f6"></span>
                <span class="firefly firefly-night f7"></span>
                <span class="firefly firefly-night f8"></span>
                <div class="falling-leaf falling-leaf-autumn2"></div>
                <div class="falling-leaf-autumn fla3"></div>
                <div class="falling-leaf-autumn fla4"></div>
                <div class="falling-leaf-autumn fla5"></div>
                <div class="falling-leaf-autumn fla6"></div>
                <div class="falling-leaf-autumn fla7"></div>
                <div class="falling-leaf-autumn fla8"></div>
                <span class="snowflake sf1"></span>
                <span class="snowflake sf2"></span>
                <span class="snowflake sf3"></span>
                <span class="snowflake sf4"></span>
                <span class="snowflake sf5"></span>
                <span class="snowflake sf6"></span>
                <span class="snowflake sf7"></span>
                <span class="snowflake sf8"></span>
                <div class="falling-petal fp1"></div>
                <div class="falling-petal fp2"></div>
                <div class="falling-petal fp3"></div>
                <div class="falling-petal fp4"></div>
                <div class="falling-petal fp5"></div>
                <div class="falling-petal fp6"></div>
                <div class="falling-petal fp7"></div>
                <div class="falling-petal fp8"></div>
                <div class="next-hint"></div>

                <!-- Animations rares du Jardin du Bambou (éveillées aux niveaux 9, 11, 15 et 17) -->
                <div class="koi-shadow"></div>
                <div class="bamboo-shoot"></div>
                <div class="bamboo-shoot bs2"></div>
                <div class="dew-drop"></div>
                <div class="high-bird"><span class="bird-wing bw-l"></span><span class="bird-wing bw-r"></span></div>

                <!-- Animations rares du Jardin d'Automne (niveaux 9, 11, 15 et 17) -->
                <div class="autumn-gust">
                    <span class="gust-leaf g1"></span><span class="gust-leaf g2"></span>
                    <span class="gust-leaf g3"></span><span class="gust-leaf g4"></span>
                    <span class="gust-leaf g5"></span><span class="gust-leaf g6"></span>
                </div>
                <div class="ground-swirl"></div>
                <div class="sun-ray"></div>
                <div class="morning-mist"></div>

                <!-- Animations rares du Jardin d'Hiver (niveaux 9, 11, 15 et 17) -->
                <div class="frost-sparkles">
                    <span class="frost fr1"></span><span class="frost fr2"></span>
                    <span class="frost fr3"></span><span class="frost fr4"></span>
                    <span class="frost fr5"></span><span class="frost fr6"></span>
                    <span class="frost fr7"></span><span class="frost fr8"></span>
                    <span class="frost fr9"></span><span class="frost fr10"></span>
                    <span class="frost fr11"></span><span class="frost fr12"></span>
                </div>
                <div class="snow-gust">
                    <span class="powder p1"></span><span class="powder p2"></span>
                    <span class="powder p3"></span><span class="powder p4"></span>
                    <span class="powder p5"></span><span class="powder p6"></span>
                    <span class="powder p7"></span><span class="powder p8"></span>
                </div>
                <div class="icicle"></div>
                <div class="moon-halo"></div>

                <!-- Animations rares du Jardin des Sakura (niveaux 9, 11, 15 et 17) -->
                <div class="petal-spiral">
                    <span class="sp-petal spp1"></span><span class="sp-petal spp2"></span>
                    <span class="sp-petal spp3"></span><span class="sp-petal spp4"></span>
                    <span class="sp-petal spp5"></span><span class="sp-petal spp6"></span>
                </div>
                <div class="sakura-branch">
                    <span class="branch-petal bp1"></span><span class="branch-petal bp2"></span>
                    <span class="branch-petal bp3"></span><span class="branch-petal bp4"></span>
                </div>
                <div class="sakura-branch sakura-branch-left">
                    <span class="branch-petal bp1"></span><span class="branch-petal bp2"></span>
                    <span class="branch-petal bp3"></span><span class="branch-petal bp4"></span>
                </div>
                <div class="pond-petal"></div>
                <div class="petal-haze"></div>

                <!-- Animations rares du Jardin de Nuit (niveaux 9, 11, 15 et 17) -->
                <div class="shooting-star"></div>
                <div class="star-field">
                    <span class="star st1"></span><span class="star st2"></span>
                    <span class="star st3"></span><span class="star st4"></span>
                    <span class="star st5"></span><span class="star st6"></span>
                    <span class="star st7"></span><span class="star st8"></span>
                    <span class="star st9"></span><span class="star st10"></span>
                    <span class="star st11"></span><span class="star st12"></span>
                    <span class="star st13"></span><span class="star st14"></span>
                    <span class="star st15"></span><span class="star st16"></span>
                </div>
                <div class="moon-reflection"></div>
                <div class="lone-firefly"></div>

                <!-- Animations rares du Jardin de l'Eau (niveaux 9, 11, 15 et 17) -->
                <div class="water-ripples">
                    <span class="wr wr1"></span><span class="wr wr2"></span>
                    <span class="wr wr3"></span><span class="wr wr4"></span>
                    <span class="wr wr5"></span><span class="wr wr6"></span>
                </div>
                <div class="lily-pad"></div>
                <div class="water-glints">
                    <span class="glint gl1"></span><span class="glint gl2"></span>
                    <span class="glint gl3"></span><span class="glint gl4"></span>
                    <span class="glint gl5"></span><span class="glint gl6"></span>
                    <span class="glint gl7"></span><span class="glint gl8"></span>
                    <span class="glint gl9"></span><span class="glint gl10"></span>
                    <span class="glint gl11"></span><span class="glint gl12"></span>
                    <span class="glint gl13"></span><span class="glint gl14"></span>
                </div>
                <div class="water-stream"></div>
                <div class="dragonfly">
                    <span class="dragonfly-wing dw-left"></span>
                    <span class="dragonfly-wing dw-right"></span>
                </div>
            </div>

            <!-- Character Layer + Puzzle Layer + UI du jeu (tout ce qui doit rester aligné avec la scène) -->
            <div class="scene-ui">
                <header class="app-header">
                    <h1 class="title">Ninja Stones</h1>
                    <div class="level-line">
                        <p id="level-display" class="level-text">Niveau 1</p>
                        <p id="level-name-display" class="level-name-text"></p>
                    </div>
                </header>

                <div class="screens-wrapper">

                    <div id="screen-menu" class="screen active">
                        <div class="screen-top">
                            <div class="garden-info">
                                <div class="garden-line">
                                    <p id="garden-name" class="garden-name">Jardin du Bambou</p>
                                    <p id="garden-stage" class="garden-stage"></p>
                                </div>
                                <div class="progress-container">
                                    <div id="progress-bar" class="progress-bar"></div>
                                </div>
                                <div id="garden-trail" class="garden-trail" aria-hidden="true"></div>
                            </div>

                            <button id="play-btn" class="btn">Jouer</button>
                        </div>
                        <!-- Character Layer -->
                        <div class="character-stage">
                            <div class="character-tilt">
                                <img id="ninja-character" class="character-container" src="assets/images/ninja-character.png" alt="Le Ninja Jardinier">
                            </div>
                        </div>
                        <p class="app-version">v1.0.45</p>
                    </div>

                    <div id="screen-game" class="screen">
                        <div class="screen-top">
                            <div class="btn-group">
                                <button id="back-btn" class="btn">Retour</button>
                            </div>
                        </div>
                        <!-- Puzzle Layer -->
                        <div class="board-frame">
                            <div id="board" class="board"></div>
                            <div id="win-overlay" class="win-overlay">
                                <img class="win-character" src="assets/images/ninja-character-win.png" alt="Le Ninja Jardinier célèbre la victoire">
                                <p id="message" class="message"></p>
                                <p id="next-garden-message" class="next-garden-message"></p>
                                <button id="continue-btn" class="btn btn-primary">Continuer</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Bouton silence : visible sur le menu comme en jeu, état mémorisé (Sprint 6) -->
            <!-- Séquence de réveil du jardin : couche transparente qui laisse voir le jardin
                 et permet d'abréger la séquence d'une simple touche -->
            <div class="awakening-layer" id="awakening-layer">
                <p class="awakening-hint">Toucher pour continuer</p>
            </div>

            <button id="mute-btn" class="mute-btn" aria-label="Couper ou activer le son">🔊</button>

            <!-- Grille de repères pour le développement (RFC-001, debugScene). Vide par défaut, remplie par JS si activée. -->
            <div class="scene-debug-grid" id="scene-debug-grid" aria-hidden="true"></div>

        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/save.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/garden.js"></script>
    <script src="js/puzzle.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/scene-debug.js"></script>
</body>
</html>
