<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Ninja Stones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- L'entête fixe -->
        <header class="app-header">
            <h1 class="title">Ninja Stones</h1>
            <p id="level-display" class="level-text">Niveau 1</p>
        </header>

        <!-- NOUVEAU : Un conteneur qui contient les deux écrans superposés -->
        <div class="screens-wrapper">
            
            <!-- ÉCRAN D'ACCUEIL -->
            <div id="screen-menu" class="screen active">
                <div id="ninja-character" class="character-container">
                    <div class="ninja-head"></div>
                    <div class="ninja-body"></div>
                </div>
                <div id="menu-board" class="board"></div>
                <button id="play-btn" class="btn">Jouer</button>
            </div>

            <!-- ÉCRAN DE JEU -->
            <div id="screen-game" class="screen">
                <div id="board" class="board"></div>
                <div class="btn-group">
                    <button id="back-btn" class="btn">Retour</button>
                    <button id="restart-btn" class="btn">Recommencer</button>
                    <button id="continue-btn" class="btn hidden">Continuer</button>
                </div>
                <p id="message" class="message"></p>
            </div>

        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
