<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json?v=1.0">
    <title>Ninja Stones</title>
    
    <style>#screen-game { display: none !important; }</style>
    
    <!-- AJOUT DU ?v=1.0 ICI -->
    <link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <h1 class="title">Ninja Stones</h1>
            <p id="level-display" class="level-text">Niveau 1</p>
        </header>

        <div class="screens-wrapper">
            
            <div id="screen-menu" class="screen active">
                <div id="ninja-character" class="character-container">
                    <div class="ninja-head"></div>
                    <div class="ninja-body"></div>
                </div>
                
                <div class="garden-info">
                    <p id="garden-name" class="garden-name">Jardin du Bambou</p>
                    <div class="progress-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>

                <div id="menu-board" class="board"></div>
                <button id="play-btn" class="btn">Jouer</button>
            </div>

            <div id="screen-game" class="screen">
                <div id="board" class="board"></div>
                <div class="btn-group">
                    <button id="back-btn" class="btn">Retour</button>
                    <button id="restart-btn" class="btn">Recommencer</button>
                    <button id="continue-btn" class="btn hidden">Continuer</button>
                </div>
                <p id="message" class="message"></p>
            </div>

        </div>
    </div>

    <!-- AJOUT DU ?v=1.0 SUR CHAQUE LIGNE ICI -->
    <script src="js/constants.js?v=1.0"></script>
    <script src="js/utils.js?v=1.0"></script>
    <script src="js/save.js?v=1.0"></script>
    <script src="js/levels.js?v=1.0"></script>
    <script src="js/garden.js?v=1.0"></script>
    <script src="js/puzzle.js?v=1.0"></script>
    <script src="js/ui.js?v=1.0"></script>
    <script src="js/app.js?v=1.0"></script>
</body>
</html>
